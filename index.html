<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo du jardin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page {
      width: 100%;
      max-width: 1400px;
      padding: 16px;
      text-align: center;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(24px, 4vw, 48px);
    }
    img {
      width: 100%;
      height: auto;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 10px 35px rgba(0,0,0,.45);
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Photo du jardin</h1>
    <img src="jardin.jpg" alt="Vue aérienne du jardin">
  </main>
</body>
</html>
